# Checks only. This workflow never deploys; hosting and DNS are handled
# outside this repository and are gated on Kaje's explicit go.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
